
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">

        <div class="inputs">
            <label for="nom">Nom:</label>
            <input type="text" id="nom" required>

            <label for="prenom">Prenom:</label>
            <input type="text" id="prenom" required>

            <label for="points">Points:</label>
            <input type="number" id="points" required>

            <button class="ajouterBtn">Ajouter</button>
        </div>

        <table id="tableau">
        </table>

        <div class="continer">

            <div class="counter">
                <p><span id="totalLigne"></span> ligne(s)</p>
                <p id="totall">
                    Total Point(s) = <span id="totalPoint"></span>
                </p>
            </div>

            <div class="buttons">
                <button class="consoleBtn btn">Console Tableau</button>
                <button class="supprimerBtn btn">Supprimer</button>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
